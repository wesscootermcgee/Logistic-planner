<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Logistic Planner</title>
<style>
/* ===== Design system (matches the polished web app) ===== */
:root{
  --bg:#f6f7fb; --surface:#fff; --surface-2:#f1f3f9; --surface-3:#e8ebf5;
  --border:#e2e6f0; --border-strong:#cdd3e3;
  --text:#1c2434; --text-soft:#4a5468; --text-muted:#8590a8;
  --primary:#6366f1; --primary-hover:#5457e5; --primary-soft:#eef0fe;
  --accent:#f59e0b; --success:#10b981; --danger:#ef4444; --info:#0ea5e9;
  --activity:#0ea5e9; --shorttrip:#f59e0b; --trip:#8b5cf6;
  --shadow-sm:0 1px 2px rgba(20,30,60,.06); --shadow:0 4px 14px rgba(20,30,60,.08); --shadow-lg:0 12px 30px rgba(20,30,60,.12);
  --radius-sm:8px; --radius:14px; --radius-lg:20px; --radius-pill:999px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1320;--surface:#171c2c;--surface-2:#1f2538;--surface-3:#2a3147;--border:#2a3147;--border-strong:#3a4259;--text:#eef1f8;--text-soft:#c2c9da;--text-muted:#8a93ab;--primary-soft:#232a45;--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow:0 4px 14px rgba(0,0,0,.35);--shadow-lg:0 12px 30px rgba(0,0,0,.45);}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.25;font-weight:700}
h1{font-size:1.5rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:0 0 .8em;line-height:1.55}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:.92rem;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
/* layout */
.app-shell{min-height:100dvh;display:flex;flex-direction:column}
.app-header{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border)}
.app-header-inner{max-width:1180px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.02rem;white-space:nowrap}
.brand .logo{font-size:1.25rem}
.nav-tabs{display:flex;align-items:center;gap:2px;margin-left:6px;overflow-x:auto}
.nav-tabs button{background:none;border:none;color:var(--text-soft);font-size:.88rem;font-weight:600;padding:7px 11px;border-radius:var(--radius-pill);transition:background .15s,color .15s;white-space:nowrap}
.nav-tabs button:hover{background:var(--surface-2);color:var(--text)}
.nav-tabs button.active{background:var(--primary-soft);color:var(--primary)}
.nav-spacer{flex:1}
.bottom-nav{display:none}
.main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:20px 16px 90px}
.page-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-title h1{margin:0}
.page-title .sub{color:var(--text-muted);font-size:.88rem}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:var(--radius-pill);padding:9px 16px;font-size:.9rem;font-weight:600;background:var(--surface-2);color:var(--text);transition:background .15s,border-color .15s,transform .05s,opacity .15s;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:transparent;border-color:var(--border-strong);color:var(--text-soft)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-subtle{background:var(--surface-2);color:var(--text-soft)}
.btn-sm{padding:5px 11px;font-size:.82rem}
.btn-icon{padding:8px;width:38px;height:38px;border-radius:var(--radius-pill)}
/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-pad{padding:16px}
.card-hover{transition:transform .12s,box-shadow .12s,border-color .12s}
.card-hover:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border-strong);cursor:pointer}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:13px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-auto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--radius-pill);font-size:.76rem;font-weight:600;background:var(--surface-3);color:var(--text-soft)}
.badge-type-activity{background:rgba(14,165,233,.14);color:#0369a1}
.badge-type-shortTrip{background:rgba(245,158,11,.16);color:#b45309}
.badge-type-trip{background:rgba(139,92,246,.16);color:#6d28d9}
@media (prefers-color-scheme:dark){.badge-type-activity{color:#7dd3fc}.badge-type-shortTrip{color:#fcd34d}.badge-type-trip{color:#c4b5fd}}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:var(--radius-pill);font-size:.8rem;font-weight:600;background:var(--surface-2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
/* forms */
label.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
label.field>.label{font-size:.82rem;font-weight:600;color:var(--text-soft)}
.req{color:var(--danger);font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}
.row.tight{gap:8px}
/* details */
details.collapsible{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:10px;overflow:hidden}
details.collapsible>summary{list-style:none;cursor:pointer;padding:12px 15px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;user-select:none}
details.collapsible>summary::-webkit-details-marker{display:none}
details.collapsible>summary .chev{transition:transform .15s;color:var(--text-muted)}
details.collapsible[open]>summary .chev{transform:rotate(90deg)}
details.collapsible>.collapsible-body{padding:4px 15px 15px}
/* states */
.empty-state{text-align:center;padding:44px 18px;color:var(--text-muted)}
.empty-state .big{font-size:2.5rem;margin-bottom:8px}
.empty-state h3{color:var(--text)}
.spinner{width:18px;height:18px;border:2.5px solid var(--surface-3);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);color:#b91c1c;border-radius:var(--radius);padding:12px 14px;font-size:.9rem}
@media (prefers-color-scheme:dark){.error-box{color:#fca5a5}}
.notice-box{background:rgba(14,165,233,.08);border:1px solid rgba(14,165,233,.25);color:#0369a1;border-radius:var(--radius);padding:12px 14px;font-size:.9rem}
@media (prefers-color-scheme:dark){.notice-box{color:#7dd3fc}}
/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:var(--radius-pill);box-shadow:var(--shadow-lg);font-size:.9rem;font-weight:600;z-index:100;max-width:90vw;text-align:center}
#toast.error{background:var(--danger);color:#fff}
/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,19,32,.55);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:640px;margin:auto}
.modal-wide{max-width:820px}
.modal-small{max-width:440px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}
.modal-head h2{margin:0}
.modal-body{padding:8px 20px 20px}
.modal-foot{display:flex;align-items:center;gap:10px;padding:14px 20px 20px;border-top:1px solid var(--border)}
.modal-foot .spacer{flex:1}
/* auth */
.auth-screen{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(1200px 600px at 50% -10%,rgba(99,102,241,.12),transparent 60%),var(--bg)}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:28px 26px}
.auth-brand{text-align:center;margin-bottom:18px}
.auth-brand .logo{font-size:2.4rem}
.auth-brand h1{margin:6px 0 2px;font-size:1.4rem}
.auth-brand .muted{margin:0}
.auth-form .field{margin-bottom:12px}
/* chat */
.chat-msg{margin-bottom:10px;display:flex}
.chat-msg.user{justify-content:flex-end}
.chat-msg .bubble{max-width:85%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.chat-msg.user .bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.chat-msg.ai .bubble{background:var(--surface-2);border:1px solid var(--border);border-bottom-left-radius:4px}
.chat-msg.ai .bubble.error{border-color:var(--danger);color:var(--danger)}
.sources-toggle{font-size:.78rem;color:var(--text-muted);margin-top:6px;cursor:pointer;background:none;border:none;padding:0;text-decoration:underline}
.sources-list{font-size:.82rem;margin-top:6px;padding-left:0;list-style:none}
.sources-list li{padding:3px 0;border-top:1px dashed var(--border)}
.sources-meta{font-size:.72rem;color:var(--text-muted);margin-top:4px}
/* helpers */
.muted{color:var(--text-muted)}
.small{font-size:.82rem}
.center{text-align:center}
.flex{display:flex;align-items:center;gap:8px}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wrap{flex-wrap:wrap}
.gap-sm{gap:6px}
.stack-sm>*+*{margin-top:8px}
.mt{margin-top:14px}
.mt-sm{margin-top:8px}
.mb{margin-bottom:14px}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
/* mobile */
@media (max-width:860px){.grid-3,.grid-2{grid-template-columns:1fr}}
@media (max-width:720px){
  .app-header-inner{padding:0 12px;gap:8px;height:52px}
  .nav-tabs{display:none}
  .main{padding:14px 12px 86px}
  h1{font-size:1.25rem}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--text-muted);font-size:.64rem;font-weight:600;padding:5px 2px}
  .bottom-nav button.active{color:var(--primary)}
  .bottom-nav .bnav-icon{font-size:1.2rem;line-height:1}
  .row>*{min-width:100%}
  .modal-overlay{padding:0}
  .modal{border-radius:0;min-height:100dvh;max-width:100%}
}
/* plan-graph (svg) */
.graph-canvas{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;height:60vh;min-height:360px;touch-action:none;cursor:grab}
.graph-canvas:active{cursor:grabbing}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-cell{min-height:62px;padding:5px;border-radius:8px;background:var(--surface);border:1px solid var(--border);cursor:pointer;text-align:left}
.cal-cell.today{outline:2px solid var(--accent)}
.cal-cell.selected{outline:2px solid var(--primary);background:var(--primary-soft)}
.cal-day-name{font-weight:700;font-size:.72rem;color:var(--text-muted);text-align:center;padding:4px 0}
.cal-event{font-size:.66rem;padding:1px 5px;border-radius:5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:720px){ .chat-layout-hack{flex-direction:column!important} .chat-sidebar{width:100%!important;min-width:0!important;max-height:none!important} }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ====================================================================
   LOGISTIC PLANNER — standalone single-file build
   Everything (plans, settings, chat history) persists in localStorage.
   AI chat calls Groq + Tavily directly from the browser (keys baked in).
   Password gate (default "poodle2") protects casual access.
   ==================================================================== */

/* ---------- Config (keys baked in for offline-family use) ---------- */
const CONFIG = {
  GROQ_KEY: "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",
  GROQ_MODEL: "llama-3.3-70b-versatile",
  GROQ_FALLBACK: "llama-3.1-8b-instant",
  TAVILY_KEY: "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",
  PASSWORD: "poodle2",
  SESSION_KEY: "lp.session",
};

/* ---------- Metadata ---------- */
const PLAN_TYPE_META = {
  activity:{label:"Activity",icon:"📍",color:"#0ea5e9"},
  shortTrip:{label:"Short Trip",icon:"🚗",color:"#f59e0b"},
  trip:{label:"Trip",icon:"✈️",color:"#8b5cf6"},
};
const STATUS_META = {
  idea:{label:"Idea",icon:"💡",color:"#94a3b8"},
  planning:{label:"Planning",icon:"📝",color:"#0ea5e9"},
  ready:{label:"Ready",icon:"✅",color:"#10b981"},
  scheduled:{label:"Scheduled",icon:"📅",color:"#6366f1"},
  inProgress:{label:"In Progress",icon:"🟢",color:"#22c55e"},
  completed:{label:"Completed",icon:"🏁",color:"#64748b"},
  canceled:{label:"Canceled",icon:"✖️",color:"#ef4444"},
};
const TRANSPORT_META = {
  driving:{label:"Driving",icon:"🚗"}, flying:{label:"Flying",icon:"✈️"}, train:{label:"Train",icon:"🚆"},
  bus:{label:"Bus",icon:"🚌"}, rental:{label:"Rental car",icon:"🚙"}, walking:{label:"Walking",icon:"🚶"},
  biking:{label:"Biking",icon:"🚴"}, other:{label:"Other",icon:"🧭"},
};
const CHECKLIST_CATS = [
  {id:"todo",label:"Things to do",icon:"✔️"},{id:"bring",label:"Things to bring",icon:"🎒"},
  {id:"packing",label:"Packing",icon:"🧳"},{id:"reservations",label:"Reservations",icon:"🎫"},
  {id:"before",label:"Before leaving",icon:"🚪"},{id:"during",label:"During trip",icon:"📸"},
  {id:"after",label:"After trip",icon:"📦"},
];

/* ---------- Storage ---------- */
const S = {
  plans: "lp.plans.v3",
  settings: "lp.settings.v3",
  chats: "lp.chats.v3",
};
function load(key, fallback){ try{ const r = localStorage.getItem(key); return r?JSON.parse(r):fallback; }catch{ return fallback; } }
function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ console.warn("save failed", e); } }
function uid(){ return 'id-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }

/* ---------- State ---------- */
let state = {
  view: "dashboard",
  detailId: null,
  newPlanOpen: false,
  newPlanDate: undefined,
  plans: load(S.plans, []),
  settings: Object.assign({freeOnlyMode:true, searchMode:"askFirst", privacy:{sendTravelerNames:false,sendAddresses:false,sendReservationNumbers:false,sendPersonalNotes:false,sendAllDetails:false}}, load(S.settings, {})),
  chats: migrateChats(load(S.chats, null)),
  activeChatId: null,
};
/* Migrate old {global:[], plan:{}} format → list of conversations.
   New shape: [{id,title,planId,createdAt,messages:[{role,content,...}]}] */
function migrateChats(old){
  if(Array.isArray(old)) return old; // already new format
  const convs=[];
  if(old && Array.isArray(old.global) && old.global.length){
    convs.push({id:uid(),title:"General chat",planId:null,createdAt:Date.now(),messages:old.global});
  }
  if(old && old.plan){
    for(const pid in old.plan){
      const msgs=old.plan[pid];
      if(Array.isArray(msgs) && msgs.length){
        convs.push({id:uid(),title:(state&&state.plans?state.plans.find(p=>p.id===pid):{title:"Plan"})?.title||"Plan chat",planId:pid,createdAt:Date.now(),messages:msgs});
      }
    }
  }
  return convs;
}
function persistPlans(){ save(S.plans, state.plans); }
function persistSettings(){ save(S.settings, state.settings); }
function persistChats(){ save(S.chats, state.chats); }

/* ---------- Date helpers ---------- */
function toISO(d){ const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,"0"); const da=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${da}`; }
function parseISO(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtRange(a,b){ const s=parseISO(a),e=parseISO(b); if(!s&&!e) return "No dates"; if(s&&e&&a!==b){ const o={month:"short",day:"numeric"}; if(s.getFullYear()!==e.getFullYear()||s.getFullYear()!==new Date().getFullYear())o.year="numeric"; return s.toLocaleDateString("en",o)+" – "+e.toLocaleDateString("en",o);} const only=s||e; return only?only.toLocaleDateString("en",{month:"short",day:"numeric",year:"numeric"}):"No dates"; }
function relativeDay(s){ const d=parseISO(s); if(!d) return ""; const t=startOfDay(new Date()); const diff=daysBetween(t,startOfDay(d)); if(diff===0)return"Today"; if(diff===1)return"Tomorrow"; if(diff===-1)return"Yesterday"; if(diff>1&&diff<=14)return`in ${diff} days`; if(diff<-1&&diff>=-30)return`${Math.abs(diff)} days ago`; return d.toLocaleDateString("en",{month:"short",day:"numeric"}); }
function tripDays(a,b){ const s=parseISO(a),e=parseISO(b); if(!s||!e) return (s||e)?1:0; return daysBetween(s,e)+1; }

/* ---------- UI helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
let toastTimer;
function toast(msg, kind){ const el=document.getElementById("toast"); if(!el) return; el.textContent=msg; el.className="toast"+(kind==="error"?" error":""); el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{el.hidden=true},2800); }
function el(tag, props, ...kids){ const e=document.createElement(tag); if(props) for(const k in props){ if(k==="class")e.className=props[k]; else if(k==="style"&&typeof props[k]==="object")Object.assign(e.style,props[k]); else if(k.startsWith("on")&&typeof props[k]==="function")e.addEventListener(k.slice(2).toLowerCase(),props[k]); else if(k==="html")e.innerHTML=props[k]; else e.setAttribute(k,props[k]); } for(const kid of kids){ if(kid==null||kid===false)continue; e.appendChild(typeof kid==="string"?document.createTextNode(kid):kid); } return e; }

/* ---------- AI: Groq ---------- */
const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
let lastGroqError = null, lastGroqSuccess = null;
async function groqChat(messages, opts={}){
  opts.model = opts.model || CONFIG.GROQ_MODEL;
  const body = { model: opts.model, messages, temperature: opts.temperature ?? 0.6, max_tokens: opts.maxTokens ?? 1024 };
  if(opts.jsonMode) body.response_format = { type:"json_object" };
  let res;
  try{
    res = await fetch(GROQ_URL, { method:"POST", headers:{"Content-Type":"application/json","Authorization":`Bearer ${CONFIG.GROQ_KEY}`}, body: JSON.stringify(body) });
  }catch(e){ throw aiErr("network","groq","Couldn't reach Groq. Check your internet."); }
  if(res.status===429){ throw aiErr("rateLimited","groq","Groq's free limit was reached. Try again in a minute — your plans are safe."); }
  if(res.status===401||res.status===403){ throw aiErr("invalidKey","groq","Groq key looks invalid."); }
  if(res.status===404 || res.status>=500){ /* try fallback */ if(opts.model===CONFIG.GROQ_MODEL && CONFIG.GROQ_FALLBACK){ opts.model=CONFIG.GROQ_FALLBACK; return groqChat(messages,opts);} throw aiErr("modelUnavailable","groq","The AI model is unavailable right now."); }
  let data; try{ data=await res.json(); }catch{ throw aiErr("parse","groq","Unexpected response."); }
  if(!res.ok) throw aiErr("http","groq",data.error?.message||"Groq error.");
  const content = data.choices?.[0]?.message?.content || "";
  lastGroqSuccess = Date.now(); lastGroqError=null;
  return content;
}
function aiErr(kind,provider,message){ const e=new Error(message||kind); e.kind=kind; e.provider=provider; return e; }
function extractJSON(text){ if(!text) return null; const f=text.match(/```(?:json)?\s*([\s\S]*?)```/i); if(f){try{return JSON.parse(f[1].trim())}catch{}} const s=text.indexOf("{"),e=text.lastIndexOf("}"); if(s!==-1&&e>s){try{return JSON.parse(text.slice(s,e+1))}catch{}} try{return JSON.parse(text.trim())}catch{return null} }
async function groqJSON(messages, opts={}){ const t=await groqChat(messages,Object.assign({},opts,{jsonMode:true})); const j=extractJSON(t); if(!j) throw aiErr("parse","groq","Couldn't read AI's structured reply."); return j; }

/* ---------- AI: Tavily ---------- */
const TAVILY_URL = "https://api.tavily.com/search";
const searchCache = new Map();
const TTL = { weather:2*3600000, hours:24*3600000, attraction:24*3600000, destination:4*86400000, road:22*60000, events:9*3600000, general:6*3600000 };
let lastTavilyError=null, lastTavilySuccess=null;
function inferKind(q){ q=q.toLowerCase(); if(/(weather|forecast|temperature|rain|snow)/.test(q))return"weather"; if(/(road|closure|construction|traffic)/.test(q))return"road"; if(/(open|hours|close|opening|closing)/.test(q))return"hours"; if(/(event|festival|concert|happening)/.test(q))return"events"; if(/(park|museum|attraction|restaurant|hotel|things to do)/.test(q))return"attraction"; if(/(near|around|destination|visit)/.test(q))return"destination"; return"general"; }
function needsSearch(q){ q=q.toLowerCase(); if(/(weather|forecast|open|hours|close|road|closure|traffic|event|happening|price|cost|ticket|travel warning|current|today|tonight|this weekend|nearby|near us)/.test(q))return true; return false; }
async function tavilySearch(query, opts={}){
  const kind = opts.kind || inferKind(query);
  const key = kind+"::"+query.toLowerCase();
  if(!opts.force){ const c=searchCache.get(key); if(c&&c.expires>Date.now()) return Object.assign({},c.result,{fromCache:true}); }
  let res;
  try{
    res = await fetch(TAVILY_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({api_key:CONFIG.TAVILY_KEY,query,topic:kind==="events"?"news":"general",include_answer:opts.includeAnswer!==false,max_results:5})});
  }catch(e){ throw aiErr("network","tavily","Couldn't reach Tavily search."); }
  if(res.status===429){ throw aiErr("quotaReached","tavily","Tavily's free credits are used up. Your plans are safe — cached info still shows."); }
  let data; try{ data=await res.json(); }catch{ throw aiErr("parse","tavily","Unexpected search response."); }
  if(!res.ok) throw aiErr("http","tavily",data.detail||"Search error.");
  lastTavilySuccess=Date.now(); lastTavilyError=null;
  const sources=(data.results||[]).map(r=>{let site="";try{site=new URL(r.url).hostname.replace(/^www\./,"")}catch{} return {title:r.title||"(untitled)",url:r.url||"",siteName:site,snippet:typeof r.content==="string"?r.content.slice(0,280):undefined};});
  const result={answer:data.answer?String(data.answer):undefined,sources,checkedOn:new Date().toISOString(),fromCache:false};
  searchCache.set(key,{result,expires:Date.now()+(TTL[kind]||TTL.general)});
  return result;
}

/* ---------- Plan context (privacy-filtered) ---------- */
function planContext(plan){
  const p=state.settings.privacy; const L=[];
  L.push("Plan type: "+PLAN_TYPE_META[plan.type].label);
  L.push("Title: "+plan.title||"(untitled)");
  L.push("Destination: "+plan.destination);
  if(plan.startLocation) L.push("Starting from: "+(p.sendAddresses?plan.startLocation:"(hidden)"));
  L.push("Dates: "+(plan.startDate?fmtRange(plan.startDate,plan.endDate):"no dates")+(plan.flexibleDates?" (flexible)":""));
  if(plan.startTime||plan.endTime) L.push("Times: "+(plan.startTime||"?")+" – "+(plan.endTime||"?"));
  if(p.sendTravelerNames&&plan.travelers&&plan.travelers.length) L.push("Travelers: "+plan.travelers.join(", ")+(plan.pets?"; pets: "+plan.pets:""));
  else if(plan.peopleCount) L.push("People: "+plan.peopleCount);
  if(plan.transportation) L.push("Transport: "+TRANSPORT_META[plan.transportation].label);
  L.push("Status: "+STATUS_META[plan.status].label);
  if(plan.destinations&&plan.destinations.length) L.push("Stops: "+plan.destinations.map(d=>d.name).join(" → "));
  if(plan.activities&&plan.activities.length) L.push("Activities: "+plan.activities.map(a=>a.text).join("; "));
  if(plan.packing&&plan.packing.length) L.push("Packing ("+plan.packing.length+"): "+plan.packing.slice(0,20).map(x=>x.text).join(", "));
  if(plan.checklists&&plan.checklists.length){ const cs=plan.checklists.filter(c=>c.items.length).map(c=>c.name+" ("+c.items.length+")").join("; "); if(cs)L.push("Checklists: "+cs); }
  if(plan.reservations&&plan.reservations.length) L.push("Reservations: "+plan.reservations.map(r=>r.title+(p.sendReservationNumbers&&r.confirmationNumber?" conf# "+r.confirmationNumber:"")).join(" | "));
  if(plan.freeform&&(p.sendAllDetails||p.sendPersonalNotes)) L.push("Freeform: "+plan.freeform);
  return L.join("\n");
}
function globalContext(){
  if(!state.plans.length) return "The user has no saved plans yet.";
  return "The user has "+state.plans.length+" plan(s):\n"+state.plans.slice(0,40).map(p=>"(id:"+p.id+") ["+PLAN_TYPE_META[p.type].label+"] \""+p.title+"\" · "+p.destination+" · "+(p.startDate?fmtRange(p.startDate,p.endDate):"no dates")).join("\n");

/* ---------- Chat (persisted as a list of conversations) ---------- */
/* Conversation shape: {id,title,planId,createdAt,messages:[{role,content,error?,sources?,...}]} */
function newConversation(planId){
  const c = {id:uid(), title: planId ? ((getPlan(planId)||{}).title||"Plan chat") : "New chat", planId, createdAt:Date.now(), messages:[]};
  state.chats.unshift(c); persistChats(); return c;
}
function getConversation(id){ return state.chats.find(c=>c.id===id); }
const APP_SYS = "You are the assistant inside 'Logistic Planner', a friendly app for planning activities, short trips, and full trips. Be warm, concise, practical. Use the provided plan context as truth. Keep answers short and skimmable.\nWhen the user asks you to CHANGE a plan (set a date, change the title/destination/time, add a packing item, etc.), the app will make that change automatically for them. Just confirm it briefly, e.g. 'Done — I set the destination to Library.' Do not ask the user to confirm; the change has already been applied.";
async function runChat(text, conv, useWeb, decision){
  const planId = conv.planId;
  const history = conv.messages.filter(m=>!m.error).slice(-10).map(m=>({role:m.role,content:m.content}));
  let context = planId ? planContext(getPlan(planId)||{}) : globalContext();
  const webAllowed = useWeb!==false && state.settings.searchMode!=="never";
  const wantSearch = webAllowed && needsSearch(text);
  if(wantSearch){
    if(state.settings.searchMode==="askFirst" && decision===undefined){
      return { needsConfirmation:true, prompt:"This question may need current web information. Use one web search?" };
    }
    if(state.settings.searchMode==="askFirst" && decision===false){ /* answer without search */ }
    else if(state.settings.searchMode==="automatic" || decision===true){
      const sr = await tavilySearch(text,{includeAnswer:true,kind:inferKind(text)});
      const block = sr.sources.length ? sr.sources.map((s,i)=>"Source "+(i+1)+": "+s.title+" ("+s.siteName+") — "+(s.snippet||"")).join("\n") : "(no sources)";
      let answer;
      try{ answer = await groqChat([{role:"system",content:"You are the helpful assistant inside Logistic Planner. Answer using ONLY these web-search sources. If not covered, say so. 2-5 sentences. Don't add citations."},{role:"user",content:"Plan context:\n"+context+"\n\nSources:\n"+block+"\n\nQuestion: "+text}],{temperature:0.4,maxTokens:512}); }
      catch(e){ if(sr.answer) answer=sr.answer; else throw e; }
      return { text:answer.trim(), sources:sr.sources, checkedOn:sr.checkedOn, fromCache:sr.fromCache, searched:true };
    }
  }
  // streamed-like plain answer
  const out = await groqChat([{role:"system",content:APP_SYS},{role:"system",content:"Current plan context:\n"+context},...history,{role:"user",content:text}],{temperature:0.6,maxTokens:768});
  return { text: out.trim() };
}

/* ---------- AI actions: detect + AUTO-APPLY plan changes (no confirm) ---------- */
const ACTION_SYS =
  "You propose a single change to the user's plan inside Logistic Planner. " +
  "If the user's message asks you to change/add/set something on a plan, return ONLY a JSON object describing the change. " +
  "If it's just a question (not a change request), return {\"action\":\"none\"}. " +
  "JSON schema: {\"action\":\"setField|addItem|none\",\"planId\":\"id of the plan to change\",\"field\":\"startDate|endDate|startTime|endTime|title|destination|transportation|startLocation|estimatedTravelTime|estimatedDistance|notes\",\"value\":\"the value to set, dates as YYYY-MM-DD, times as HH:MM\",\"summary\":\"one short sentence describing the change in plain English\",\"list\":\"packing|todo (only for addItem)\",\"item\":\"text of item to add (only for addItem)\"} " +
  "Rules: Use the planId from the context. For dates use YYYY-MM-DD. For 'tomorrow'/'next week' figure out the actual date. Never invent a planId; if no specific plan is mentioned and the context has exactly one plan, use that one; otherwise return action none and ask which plan. Output minified JSON only, no prose.";

function looksLikeEdit(text){
  const q = text.toLowerCase();
  return /(add|set|change|update|move|reschedule|cancel|remove|rename|schedule|put|make|give|switch|edit|fix|correct|turn|mark|book).*(date|time|start|end|title|name|destination|location|transport|reservation|reminder|note|packing|item|hotel|stop|people|traveler|status)/.test(q)
      || /(date|time|title|name|destination|location|reminder|status).*(to|for|as|from)/.test(q)
      || /^add |^set |^change |^update |^move |^rename |^remove |^cancel |^schedule /.test(q)
      || /(should be|needs? to be|make it|call it|name it|title it)/.test(q);
}

async function proposeAction(text, planId){
  let plansCtx;
  if(planId){
    const p = getPlan(planId);
    if(!p) return null;
    plansCtx = "The current plan (id: "+p.id+"):\n" + planContext(p);
  } else {
    plansCtx = "The user's plans (use the matching id):\n" + globalContext();
  }
  try{
    const raw = await groqJSON([
      {role:"system", content: ACTION_SYS},
      {role:"system", content: "Today is " + toISO(new Date()) + ". " + plansCtx},
      {role:"user", content: text},
    ], {temperature:0.2, maxTokens:300});
    if(!raw || raw.action === "none" || !raw.action) return null;
    if(!getPlan(raw.planId)){
      if(planId && getPlan(planId)){ raw.planId = planId; }
      else if(state.plans.length === 1){ raw.planId = state.plans[0].id; }
      else {
        const s = (raw.summary||"").toLowerCase();
        const match = state.plans.find(p => s.includes(p.title.toLowerCase()) || s.includes(p.destination.toLowerCase()));
        if(match) raw.planId = match.id; else return null;
      }
    }
    return raw;
  }catch(e){ return null; }
}

function applyProposedAction(a){
  const p = getPlan(a.planId);
  if(!p) return false;
  if(a.action === "setField" && a.field){
    const synonyms = { name:"title", location:"destination", start:"startDate", end:"endDate", departTime:"startTime", returnTime:"endTime", transport:"transportation", travelers:"peopleCount", people:"peopleCount", description:"notes" };
    const field = synonyms[a.field] || a.field;
    const allowed = ["startDate","endDate","startTime","endTime","title","destination","transportation","startLocation","estimatedTravelTime","estimatedDistance","notes","peopleCount","priority","status"];
    if(!allowed.includes(field)) return false;
    let val = a.value;
    if(field === "peopleCount") val = Number(val) || undefined;
    updatePlan(p.id, {[field]: val});
    return true;
  }
  if(a.action === "addItem" && a.item){
    if(a.list === "packing" || !a.list){
      p.packing.push({id:uid(), text:String(a.item), done:false, aiSuggested:true});
      updatePlan(p.id, {packing:p.packing});
      return true;
    }
    const cat = a.list;
    let cl = p.checklists.find(c=>c.category===cat);
    if(!cl){ cl = {id:uid(), category:cat, name:(CHECKLIST_CATS.find(c=>c.id===cat)||{label:cat}).label, items:[]}; p.checklists.push(cl); }
    cl.items.push({id:uid(), text:String(a.item), done:false, aiSuggested:true});
    updatePlan(p.id, {checklists:p.checklists});
    return true;
  }
  return false;
}

async function sendChatMessage(text, conv, useWeb, box, inp){

  }
  drawChat(box, conv, inp, true);
  let decision;
  while(true){
    let result;
    try{ result=await runChat(text, conv, useWeb, decision); }
    catch(e){ const m=e.message||"AI request failed."; conv.messages.push({role:"assistant",content:m,error:true}); persistChats(); drawChat(box,conv,inp); return; }
    if(result.needsConfirmation){
      const ok=await askSearchConfirm(result.prompt);
      if(ok===true){ decision=true; continue; }
      if(ok===false){ decision=false; continue; }
      conv.messages.pop(); persistChats(); drawChat(box,conv,inp);
      return;
    }
    const msg=Object.assign({role:"assistant",content:result.text}, result.sources?{sources:result.sources,checkedOn:result.checkedOn,fromCache:result.fromCache,searched:true}:{});
    conv.messages.push(msg); persistChats(); drawChat(box,conv,inp);

    // AUTO-APPLY: if it looks like an edit, do it immediately (no confirm).
    if(looksLikeEdit(text)){

      if(action && action.summary){

        if(ok){
          msg.applied = action.summary; persistChats(); drawChat(box,conv,inp);
          // refresh plan detail if open
          if(state.detailId && state.detailId===action.planId){ /* overview will re-read on next open */ }
        }
      }
    }
    return;
  }
}

    else { foot.appendChild(el("button",{class:"btn btn-ghost",onclick:()=>{step=0;draw();}},"‹ Back")); foot.appendChild(el("div",{class:"spacer"})); foot.appendChild(el("button",{class:"btn btn-ghost",onclick:closeModal},"Cancel")); foot.appendChild(el("button",{class:"btn btn-primary",onclick:()=>{ if(!data.destination.trim())return toast("Enter a destination.","error"); const p=createPlan({type,destination:data.destination.trim(),title:data.destination.trim(),startDate:/^\d{4}-\d{2}-\d{2}$/.test(data.date)?data.date:undefined,endDate:/^\d{4}-\d{2}-\d{2}$/.test(data.date)?data.date:undefined,freeform:data.freeform.trim()}); closeModal(); toast("Plan saved 🎉"); openPlan(p.id); }},"Save Plan")); }

/* ---------- Plan Detail ---------- */
let detailTab="overview";
function renderDetail_real(id){
  const plan=getPlan(id); if(!plan){ state.detailId=null; render(); return; }
  const main=document.getElementById("main"); main.innerHTML="";
  const meta=PLAN_TYPE_META[plan.type], st=STATUS_META[plan.status], dur=tripDays(plan.startDate,plan.endDate);
  main.appendChild(el("div",{class:"page-title"},
    el("div",{class:"flex gap-sm",style:{alignItems:"center"}},
      el("button",{class:"btn btn-ghost btn-sm",onclick:()=>{state.detailId=null;render();}},"‹ Back"),
      el("div",{},
        el("div",{class:"flex gap-sm wrap",style:{alignItems:"center"}}, el("span",{class:"badge badge-type-"+plan.type},meta.icon+" "+meta.label), el("span",{class:"badge"},el("span",{class:"dot",style:{background:st.color}})," "+st.label)),
        el("h1",{style:{marginTop:6}}, plan.title||plan.destination),
        el("div",{class:"muted small"}, "📍 "+plan.destination+" · 🗓️ "+fmtRange(plan.startDate,plan.endDate)+(dur>1?" · "+dur+" days":"")))),
    el("div",{class:"flex gap-sm wrap"},
      el("button",{class:"btn btn-ghost btn-sm",onclick:()=>deleteThisPlan(plan)},"Delete"))
  ));
  // tabs
  const tabs=[["overview","Overview"],["lists","Lists ("+(plan.packing.length+plan.checklists.reduce((s,c)=>s+c.items.length,0))+")"],["notes","Notes"],["chat","AI Chat"]];
  const tw=el("div",{class:"flex wrap gap-sm mb",style:{borderBottom:"1px solid var(--border)",paddingBottom:8}});
  tabs.forEach(([id,label])=>tw.appendChild(el("button",{class:"btn btn-sm "+(detailTab===id?"btn-primary":"btn-subtle"),onclick:()=>{detailTab=id;render();}},label)));
  main.appendChild(tw);
  if(detailTab==="overview") renderDetailOverview(main,plan);
  else if(detailTab==="lists") renderDetailLists(main,plan);
  else if(detailTab==="notes") renderDetailNotes(main,plan);
  else if(detailTab==="chat"){
    // jump to the Chat view with this plan's conversation active
    let c = state.chats.find(ch=>ch.planId===plan.id);
    if(!c) c = newConversation(plan.id);
    state.activeChatId = c.id;
    state.detailId = null; state.view = "chat"; render();
  }
}
function deleteThisPlan(plan){ if(!confirm("Delete \u201C"+plan.title+"\u201D? This can't be undone."))return; deletePlan(plan.id); state.detailId=null; toast("Plan deleted"); render(); }

function inputRow(plan,label,fieldId,type,req){
  const f=el("label",{class:"field"}); f.appendChild(el("span",{class:"label"},label+(req?" *":"")));

function selectRow(plan,label,fieldId,options){

function renderDetailLists(main,plan){
  const grid=el("div",{class:"grid grid-2"});
  // packing
  const pk=el("div",{class:"section"}); pk.appendChild(el("h3",{},"🎒 Packing")); pk.appendChild(listEditor(plan,plan.packing,"packing")); grid.appendChild(pk);
  // checklists (categories) — NOTE: do NOT mutate plan.checklists during render.
  // We create the list lazily only when the user adds an item to it.
  const cl=el("div",{class:"section"}); cl.appendChild(el("h3",{},"📝 Checklists"));
  const cats=[...CHECKLIST_CATS];
  const stateRef = { activeCat: (plan._lastListCat || (plan.checklists.find(c=>c.items.length)?.category) || "todo") };
  const tabs=el("div",{class:"flex wrap gap-sm mb"});
  function drawTabs(){
    tabs.innerHTML="";
    cats.forEach(c=>{
      const list=plan.checklists.find(x=>x.category===c.id);
      const total=list?list.items.length:0;
      tabs.appendChild(el("button",{class:"badge"+(stateRef.activeCat===c.id?" badge-type-activity":""),style:{cursor:"pointer",padding:"6px 11px",opacity:stateRef.activeCat===c.id?1:.7},onclick:()=>{stateRef.activeCat=c.id; plan._lastListCat=c.id; drawTabs(); drawList();}}, c.icon+" "+c.label+(total?" ("+total+")":"")));
    });
  }
  const listHost=el("div",{});
  function drawList(){
    listHost.innerHTML="";
    const existing = plan.checklists.find(c=>c.category===stateRef.activeCat);
    // pass a virtual list that creates+appends itself on first add (no mutation on render)
    const virtualList = existing || {id:uid(),category:stateRef.activeCat,name:(CHECKLIST_CATS.find(c=>c.id===stateRef.activeCat)||{label:stateRef.activeCat}).label,items:[]};
    const committed = !!existing;
    listHost.appendChild(listEditor(plan, virtualList.items, null, ()=>{
      if(!committed){ plan.checklists.push(virtualList); }
      updatePlan(plan.id,{checklists:plan.checklists});
    }));
  }
  drawTabs(); drawList();
  cl.appendChild(tabs); cl.appendChild(listHost);
  grid.appendChild(cl);
  // Reservations (real reservations, not a checklist)
  const rs=el("div",{class:"section"}); rs.appendChild(el("h3",{},"🎫 Reservations"));
  if(plan.reservations && plan.reservations.length){
    plan.reservations.forEach(r=>{
      const row=el("div",{class:"card card-pad",style:{marginBottom:8}});
      row.appendChild(el("div",{class:"flex-between"}, el("strong",{},r.title), el("div",{class:"flex gap-sm"}, el("span",{class:"badge"},r.type), el("button",{class:"btn btn-ghost btn-sm",onclick:()=>{plan.reservations=plan.reservations.filter(x=>x.id!==r.id);updatePlan(plan.id,{reservations:plan.reservations});renderDetail_real(plan.id);}},"✕"))));
      if(r.date) row.appendChild(el("div",{class:"muted small"},"📅 "+r.date));
      if(r.confirmationNumber) row.appendChild(el("div",{class:"muted small"},"Confirmation: "+r.confirmationNumber));
      if(r.notes) row.appendChild(el("div",{class:"small mt-sm"},r.notes));
      rs.appendChild(row);
    });
  } else { rs.appendChild(el("p",{class:"muted small"},"No reservations yet.")); }
  rs.appendChild(el("button",{class:"btn btn-subtle btn-sm mt-sm",onclick:()=>{const title=prompt("Reservation name (e.g. Hilton — 2 nights)");if(!title)return;const type=prompt("Type: lodging, travel, activity, restaurant, or other","lodging");plan.reservations.push({id:uid(),type:(type||"other").trim(),title});updatePlan(plan.id,{reservations:plan.reservations});renderDetail_real(plan.id);}},"＋ Add reservation"));
  grid.appendChild(rs);
  main.appendChild(grid);
}
function listEditor(plan,arr,field,onChange){
  const wrap=el("div");
  const ul=el("ul",{style:{listStyle:"none",padding:0,margin:"0 0 8px"}});
  arr.forEach(it=>{ const li=el("li",{class:"flex-between",style:{padding:"6px 0",borderBottom:"1px solid var(--border)"}}, el("label",{class:"flex gap-sm",style:{cursor:"pointer"}}, (()=>{const cb=el("input",{type:"checkbox"}); cb.checked=!!it.done; cb.onchange=()=>{it.done=cb.checked; if(onChange)onChange(); else updatePlan(plan.id,{[field]:arr});}; return cb;})(), el("span",{style:{textDecoration:it.done?"line-through":"none"}}, it.text+(it.aiSuggested?" ✨":""))), el("button",{class:"btn btn-ghost btn-sm",onclick:()=>{const next=arr.filter(x=>x.id!==it.id); if(onChange){arr.length=0; next.forEach(x=>arr.push(x)); onChange();} else updatePlan(plan.id,{[field]:next}); renderDetail_real(plan.id);}},"✕")); ul.appendChild(li); });
  wrap.appendChild(ul);
  const row=el("div",{class:"flex gap-sm"}); const inp=el("input",{placeholder:"Add…"}); const btn=el("button",{class:"btn btn-primary btn-sm"},"Add");
  function add(){ const t=inp.value.trim(); if(!t)return; arr.push({id:uid(),text:t,done:false}); if(onChange)onChange(); else updatePlan(plan.id,{[field]:arr}); renderDetail_real(plan.id); }
  btn.onclick=add; inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add();}});
  row.appendChild(inp); row.appendChild(btn); wrap.appendChild(row); return wrap;
}
